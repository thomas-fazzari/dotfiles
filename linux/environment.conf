# Session environment (systemd environment.d), seen by GUI apps and agent shells
# Symlinked to ~/.config/environment.d/10-dotfiles.conf, applied at the next login

# mise installs its .NET SDKs into this shared root
DOTNET_ROOT=${HOME}/.local/share/mise/dotnet-root
PATH=${HOME}/.local/share/mise/shims:${HOME}/.local/bin:${HOME}/.cargo/bin:${HOME}/go/bin:${PATH}
