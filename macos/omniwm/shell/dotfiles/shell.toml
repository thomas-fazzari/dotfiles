# Overrides OmniWM's managed default/ profile, which also shadows [workspaceBar] in settings.toml.
# With a single workspace, the workspaces widget shows the open apps' icons.
leading = ["apple-menu", "app-menu", "omniwm", "workspaces"]
center = []
trailing = ["media", "volume", "wifi", "battery-details", "control-center", "system-stats", "clock"]

[workspaceBar]
showLabels = false
hideEmptyWorkspaces = true
