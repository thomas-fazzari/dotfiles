"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
command_timeout = 2000
format = "$directory$git_branch$git_status$character"

[directory]
style = "#7AA2F7"
before_repo_root_style = "#515670"
repo_root_style = "bold #7AA2F7"
truncation_length = 4
truncate_to_repo = false
truncation_symbol = ""
fish_style_pwd_dir_length = 1
read_only = " 󰌾"
read_only_style = "#DB4B4B"

[git_branch]
style = "#73DACA"
format = "[$symbol$branch(:$remote_branch)]($style) "

# File states use VS Code's git decoration colors.
[git_status]
style = "#787C99"
format = "([$ahead_behind$stashed$conflicted$staged$renamed$modified$deleted$untracked]($style))"
ahead = "⇡$count "
behind = "⇣$count "
diverged = "⇣$behind_count⇡$ahead_count "
stashed = "*$count "
conflicted = "[~$count ](#BB7A61)"
staged = "[+$count ](#449DAB)"
renamed = "[»$count ](#449DAB)"
modified = "[!$count ](#6183BB)"
deleted = "[✘$count ](#914C54)"
untracked = "[?$count ](#449DAB)"

[character]
success_symbol = "[❯](#73DACA)"
error_symbol = "[❯](#DB4B4B)"
vimcmd_symbol = "[❮](#73DACA)"
