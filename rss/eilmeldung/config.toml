# Rendered to ~/.config/eilmeldung/config.toml with themes/current/eilmeldung.toml appended
# Only the settings that differ from the defaults, see
# https://github.com/christo-auer/eilmeldung/blob/main/examples/default-config.toml

startup_commands = ["sync"]
sync_every_minutes = 60
enclosure_command = "open {url}"

# Local feeds, no account, so the first launch skips the interactive setup
[login_setup]
login_type = "no_login"
provider = "local_rss"
