min_version = "2026.9.0"

# Symlinked to ~/.config/mise/config.toml, mise.lock next to it
#
# All CLI tools, except bootstrap, fish startup, native libs and apps (Brewfile)
[tools]
"aqua:neovim/neovim" = "latest"
"aqua:taiki-e/cargo-llvm-cov" = "latest"
actionlint = "latest"
ast-grep = "latest"
bat = "latest"
bun = "latest"
cargo-deny = "latest"
"cargo:cargo-sweep" = "latest"
cmake = "latest"
delta = "latest"
difftastic = "latest"
dotnet = "10.0.400"
"dotnet:csharpier" = "latest"
"dotnet:dotnet-ef" = "latest"
"dotnet:dotnet-outdated-tool" = "latest"
"dotnet:fantomas" = "latest"
"dotnet:fsautocomplete" = "latest"
"dotnet:ilspycmd" = "latest"
"dotnet:roslyn-language-server" = "latest"
"dotnet:ThomasFazzari.RoslynBridge" = "latest"
"dotnet:vpk" = "latest"
fd = "latest"
"github:bnjbvr/cargo-machete" = "latest"
"github:christo-auer/eilmeldung" = "latest"
"github:Feel-ix-343/markdown-oxide" = "latest"
"github:nextest-rs/nextest" = { version = "latest", version_prefix = "cargo-nextest-" }
"github:Samsung/netcoredbg" = { version = "latest", platforms = { macos-arm64 = { asset_pattern = "netcoredbg-osx-arm64.zip" }, linux-x64 = { asset_pattern = "netcoredbg-linux-amd64.tar.gz" } } }
go = "1.27"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
gofumpt = "latest"
golangci-lint = "latest"
hyperfine = "latest"
jq = "latest"
just = "latest"
lua-language-server = "latest"
mr-boxington = "latest"
ninja = "latest"
node = "26"
"npm:basedpyright" = "latest"
"npm:bash-language-server" = "latest"
"npm:fish-lsp" = "latest"
"npm:perlnavigator-server" = { version = "latest", allow_low_downloads = true }
"npm:typescript" = "latest"
"npm:yaml-language-server" = "latest"
oxfmt = "latest"
oxlint = "latest"
pi = "latest"
"pipx:termaid" = { version = "latest", extras = "rich" }
# macOS only: on Linux it would shadow /usr/bin/python3 and break system scripts needing distro modules (gi)
python = { version = "3.14", os = ["macos"] }
ripgrep = "latest"
rtk = "latest"
ruff = "latest"
rust = { version = "stable", profile = "minimal", components = [
  "rust-analyzer",
  "rust-src",
  "rustfmt",
  "clippy",
  "llvm-tools",
] }
sd = "latest"
shellcheck = "latest"
shfmt = "latest"
sqlc = "latest"
stylua = "latest"
tinymist = "latest"
tombi = "latest"
topgrade = "latest"
tree-sitter = "latest"
typst = "latest"
typstyle = "latest"
uv = "latest"
yq = "latest"

[settings]
lockfile = true
# Otherwise the global rust entry sets RUSTUP_TOOLCHAIN, which overrides each project's rust-toolchain.toml
idiomatic_version_file_enable_tools = ["rust"]

# Routes cargo through mbx's build cache.
# The rust tool's mr_boxington option would skip projects whose toolchain comes from rust-toolchain.toml.
# `mbx setup --global` writes this entry but replaces the config symlink with a copy: re-link after running it.
[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[env]
# Perl::Critic and Perl::Tidy install their scripts into the keg-only Homebrew perl
_.path = ["/opt/homebrew/opt/perl/bin"]

[task_config]
dir = "~/Dev/dotfiles"

[tasks.setup]
description = "Full machine setup"
run = [
  { task = "apps:install" },
  { task = "vscode" },
  { task = "tools" },
  { task = "perl" },
  { task = "symlinks" },
  { task = "hooks:deps" },
  { task = "pi" },
  { task = "wallpaper" },
]

# macos/Brewfile on macOS
# linux/packages.txt (repos and AUR, through paru) on Linux
[tasks.apps]
description = "Reports missing or outdated app dependencies without installing anything"
run = """
{% if os() == "macos" %}brew bundle check --verbose --file macos/Brewfile
{% else %}sed -e 's/#.*//' -e '/^[[:space:]]*$/d' linux/packages.txt | xargs pacman -T
{% endif %}"""

[tasks."apps:install"]
description = "Installs and upgrades app dependencies, plus the linux/hooks pacman hooks on Linux"
run = """
{% if os() == "macos" %}brew bundle install --file macos/Brewfile
{% else %}sed -e 's/#.*//' -e '/^[[:space:]]*$/d' linux/packages.txt | xargs -o paru -Syu --needed
sudo install -Dm644 -t /etc/pacman.d/hooks linux/hooks/*.hook
{% endif %}"""

[tasks."apps:prune"]
description = "Lists installed apps that are not in the app list, minus the CachyOS installer's packages on Linux (pass --force on macOS to uninstall them)"
run = """
{% if os() == "macos" %}brew bundle cleanup --file macos/Brewfile
{% else %}installer=$(awk '{ gsub(/[-T:]/, " ", $1); t = mktime(substr($1, 2, 19)); start = start ? start : t } t > start + 600 {exit} /\\[ALPM\\] installed/ {print $4}' /var/log/pacman.log)
pacman -Qqe | grep -vxF -e "$(sed -e 's/#.*//' -e 's/[[:space:]]*$//' -e '/^$/d' linux/packages.txt)" -e "$installer"
{% endif %}"""

[tasks.audit]
description = "Reports reclaimable disk space, broken dotfile links and system health without changing anything"
run = "agentic/skills/dd-audit/scripts/audit.pl"

[tasks.lgtm]
description = "Starts the local Grafana LGTM container for Pi telemetry (Grafana on :3000, OTLP on :4318)"
run = "docker start lgtm"

[tasks.zen]
description = "Rebuilds zen/user.js from the latest BetterZen plus zen/user-overrides.js and links it into the default Zen profile"
run = "zen/update-userjs.pl"

[tasks."hooks:deps"]
description = "Installs the agent hooks' dependencies, including the shell parser bash-guard needs to run"
dir = "~/Dev/dotfiles/agentic/hooks"
run = "bun install"

[tasks."hooks:test"]
description = "Tests the agent hooks"
dir = "~/Dev/dotfiles/agentic/hooks"
run = "bun test"

[tasks."hooks:lint"]
description = "Checks the formatting of the agent hooks, lints and typechecks them"
dir = "~/Dev/dotfiles/agentic/hooks"
run = [
  "bun run oxfmt --check",
  "bun run oxlint --config oxlint.json --deny-warnings --report-unused-disable-directives",
  "tsc -p .",
]

[tasks.fmt]
description = "Formats the Lua and Perl files"
run = ["stylua nvim", "fd -e pl -e pm -e t -E agentic/pi-config -X perltidy -b -bext=/"]

[tasks.lint]
description = "Checks Lua and Perl formatting and runs Perl::Critic"
run = '''
stylua --check nvim
files=$(fd -e pl -e pm -e t -E agentic/pi-config)
perlcritic --quiet --severity 4 --program-extensions .t $files
status=0
for f in $files; do
  perltidy -st "$f" | cmp -s "$f" - || { echo "untidy: $f"; status=1; }
done
exit $status
'''

[tasks."nnw:theme"]
description = "Copies rss/TokyoNight.nnwtheme into NetNewsWire, whose sandbox can't follow a symlink out of its container"
run = 'rsync -a --delete rss/TokyoNight.nnwtheme/ "$HOME/Library/Containers/com.ranchero.NetNewsWire-Evergreen/Data/Library/Application Support/NetNewsWire/Themes/TokyoNight.nnwtheme/"'

[tasks.perl]
description = "Installs Perl::Critic into the Homebrew perl for PerlNavigator (Perl::Tidy ships with it, Linux gets both from pacman)"
run = "{% if os() == 'macos' %}cpanm --notest --quiet Perl::Critic{% endif %}"

[tasks.pi]
description = "Links the Pi configuration from the agentic/pi-config submodule and installs its packages"
run = [
  "test -e agentic/pi-config/setup.sh || git submodule update --init agentic/pi-config",
  "bash agentic/pi-config/setup.sh",
  "mise -C agentic/pi-config run packages",
]

[tasks.symlinks]
description = "Links the tracked config files into their expected locations"
run = "scripts/setup-symlinks.pl"

[tasks."symlinks:check"]
description = "Reports missing, wrong or stale links without changing anything"
run = "scripts/setup-symlinks.pl --check"

[tasks.tools]
description = "Installs the mise-managed tools listed under [tools]"
run = "mise install"

[tasks.vscode]
description = "Installs the VS Code extensions listed in vscode/extensions.txt"
run = "vscode/setup-extensions.pl"

[tasks.wallpaper]
description = "Sets the desktop picture from wallpapers/ (DMS on Linux)"
run = """
{% if os() == "macos" %}osascript -e 'tell application "Finder" to set desktop picture to (POSIX file "'"$PWD/wallpapers/creation-ascii.png"'" as alias)'
{% else %}dms ipc call wallpaper set "$PWD/wallpapers/bridge-over-water.jpg"
{% endif %}"""
