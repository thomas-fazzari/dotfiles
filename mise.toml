min_version = "2026.9.0"

# Symlinked to ~/.config/mise/config.toml
# Dev runtimes and language tooling only
[tools]
"aqua:taiki-e/cargo-llvm-cov" = "latest"
bun = "latest"
cargo-deny = "latest"
"cargo:cargo-sweep" = "latest"
dotnet = "10.0.400"
"dotnet:csharpier" = "latest"
"dotnet:dotnet-ef" = "latest"
"dotnet:dotnet-outdated-tool" = "latest"
"dotnet:ElectronNET.CLI" = "latest"
"dotnet:fantomas" = "latest"
"dotnet:fsautocomplete" = "latest"
"dotnet:ilspycmd" = "latest"
"dotnet:roslyn-language-server" = "latest"
"dotnet:ThomasFazzari.RoslynBridge" = "latest"
"dotnet:vpk" = "latest"
"github:bnjbvr/cargo-machete" = "latest"
"github:Feel-ix-343/markdown-oxide" = "latest"
"github:nextest-rs/nextest" = { version = "latest", version_prefix = "cargo-nextest-" }
"github:Samsung/netcoredbg" = { version = "latest", asset_pattern = "netcoredbg-osx-arm64.zip" }
go = "1.27"
"go:golang.org/x/tools/gopls" = "latest"
golangci-lint = "latest"
lua-language-server = "latest"
node = "26"
"npm:typescript" = "latest"
oxfmt = "latest"
oxlint = "latest"
pi = "latest"
"pipx:termaid" = { version = "latest", extras = "rich" }
python = "3.14"
rtk = "latest"
stylua = "latest"
tinymist = "latest"
tree-sitter = "latest"
typst = "latest"
typstyle = "latest"
uv = "latest"

[env]
# Perl::Critic and Perl::Tidy install their scripts into the keg-only Homebrew perl
_.path = ["/opt/homebrew/opt/perl/bin"]

[task_config]
dir = "~/Dev/dotfiles"

[tasks.setup]
description = "Full machine setup"
run = [
  { task = "apps:install" },
  { task = "vscode" },
  { task = "tools" },
  { task = "rust" },
  { task = "perl" },
  { task = "symlinks" },
  { task = "pi" },
  { task = "wallpaper" },
]

[tasks.apps]
description = "Reports missing or outdated Brewfile dependencies without installing anything"
run = "brew bundle check --verbose --file macos/Brewfile"

[tasks."apps:install"]
description = "Installs and upgrades Brewfile dependencies"
run = "brew bundle install --file macos/Brewfile"

[tasks."apps:prune"]
description = "Lists Homebrew packages that are not in the Brewfile (pass --force to uninstall them)"
run = "brew bundle cleanup --file macos/Brewfile"

[tasks.audit]
description = "Reports reclaimable disk space, broken dotfile links and system health without changing anything"
run = "agentic/skills/dd-audit/scripts/audit.pl"

[tasks.zen]
description = "Rebuilds zen/user.js from the latest BetterZen plus zen/user-overrides.js and links it into the default Zen profile"
run = "zen/update-userjs.pl"

[tasks."hooks:test"]
description = "Tests the agent hooks"
run = "prove agentic/hooks/t"

[tasks.fmt]
description = "Formats the Lua and Perl files"
run = ["stylua nvim", "fd -e pl -e pm -e t -E agentic/pi-config -E rss/fil -X perltidy -b -bext=/"]

[tasks.lint]
description = "Checks Lua and Perl formatting and runs Perl::Critic"
run = '''
stylua --check nvim
files=$(fd -e pl -e pm -e t -E agentic/pi-config -E rss/fil)
perlcritic --quiet --severity 4 --program-extensions .t $files
status=0
for f in $files; do
  perltidy -st "$f" | cmp -s "$f" - || { echo "untidy: $f"; status=1; }
done
exit $status
'''

[tasks.perl]
description = "Installs Perl::Critic into the Homebrew perl for PerlNavigator (Perl::Tidy ships with it)"
run = "cpanm --notest --quiet Perl::Critic"

[tasks.pi]
description = "Links the Pi configuration from the agentic/pi-config submodule and installs its packages"
run = [
  "test -e agentic/pi-config/setup.sh || git submodule update --init agentic/pi-config",
  "bash agentic/pi-config/setup.sh",
  "mise -C agentic/pi-config run packages",
  "herdr integration install pi",
]

[tasks.rust]
description = "Installs the stable toolchain and its components through rustup"
run = [
  "rustup show active-toolchain >/dev/null 2>&1 || rustup toolchain install stable --profile minimal",
  "rustup component add rust-analyzer rust-src rustfmt clippy llvm-tools-preview",
]

[tasks.symlinks]
description = "Links the tracked config files into their expected locations"
run = "macos/scripts/setup-symlinks.pl"

[tasks.tools]
description = "Installs the mise-managed tools listed under [tools]"
run = "mise install"

[tasks.vscode]
description = "Installs the VS Code Insiders extensions listed in editors/vscode/extensions.txt"
run = "editors/vscode/setup-extensions.pl"

[tasks.wallpaper]
description = "Sets macos/wallpaper.png as the desktop picture"
run = "osascript -e 'tell application \"Finder\" to set desktop picture to (POSIX file \"'\"$PWD/macos/wallpaper.png\"'\" as alias)'"
