providers:
  llmgateway:
    baseUrl: https://api.llmgateway.io/v1
    api: openai-completions
    apiKey: LLM_GATEWAY_API_KEY
    auth: apiKey
    authHeader: true

    compat:
      supportsStore: false
      supportsDeveloperRole: false
      maxTokensField: max_tokens
      reasoningContentField: reasoning

    models:
      - id: kimi-k3
        name: Kimi K3 (DevPass)
        reasoning: true
        supportsTools: true
        input: [text, image]
        contextWindow: 1048576
        maxTokens: 131072

        compat:
          supportsReasoningEffort: true
          thinkingFormat: openai
          alwaysSendMaxTokens: true

          requiresReasoningContentForToolCalls: true
          allowsSyntheticReasoningContentForToolCalls: false
          requiresAssistantContentForToolCalls: true

          reasoningEffortMap:
            minimal: low
            low: low
            medium: high
            high: high
            xhigh: max
            max: max

      - id: glm-5.2
        name: GLM-5.2
        reasoning: true
        supportsTools: true
        input: [text]
        contextWindow: 1048576
        maxTokens: 65536

        compat:
          supportsReasoningEffort: true
          thinkingFormat: openai

      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro
        reasoning: true
        supportsTools: true
        input: [text]
        contextWindow: 1050000
        maxTokens: 65536

        compat:
          supportsReasoningEffort: true
          thinkingFormat: openai

      - id: minimax-m3
        name: MiniMax M3
        reasoning: true
        supportsTools: true
        input: [text, image]
        contextWindow: 1048576
        maxTokens: 32768

      - id: qwen3.8-max
        name: Qwen3.8 Max
        reasoning: true
        supportsTools: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 65536

      - id: mimo-v2.5-pro
        name: MiMo V2.5 Pro
        reasoning: true
        supportsTools: true
        input: [text]
        contextWindow: 1000000
        maxTokens: 32768
